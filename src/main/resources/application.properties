spring.application.name=digital-banking-api

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/digital_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema NAO e criado nem alterado automaticamente pela aplicacao.
# Aplique o script db/schema.sql (instalacao nova) ou db/migracao-v1-para-v2.sql
# (banco existente) manualmente, conforme o README.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
