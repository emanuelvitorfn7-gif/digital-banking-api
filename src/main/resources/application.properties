spring.application.name=digital-banking-api

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/digital_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

# schema.sql (src/main/resources/db) e aplicado manualmente pelo DBA/Workbench.
# Garante que o Spring nunca execute o script automaticamente.
spring.sql.init.mode=never

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seguranca (HTTP Basic, usuarios em memoria) - APENAS demonstracao ---
# Credenciais sobrescreviveis por variaveis de ambiente (ver .env.example).
# Sobrescreva SEMPRE em ambientes reais.
app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.security.client.username=${APP_CLIENT_USERNAME:cliente}
app.security.client.password=${APP_CLIENT_PASSWORD:cliente123}
